<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>MarkCard 发布助手</title>
    <link rel="icon" href="icons/32.png" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>
      <img src="icons/32.png" alt="" width="20" height="20" />
      MarkCard 发布助手
    </h1>

    <section class="card">
      <div class="row">
        <span class="label">发布包</span>
        <span id="bundleName" class="value">未选择</span>
      </div>
      <dl id="summary" class="summary hidden">
        <div><dt>渠道</dt><dd id="sChannel">-</dd></div>
        <div><dt>画布</dt><dd id="sCanvas">-</dd></div>
        <div><dt>图片</dt><dd id="sCount">-</dd></div>
        <div><dt>标题</dt><dd id="sTitle">-</dd></div>
        <div><dt>正文</dt><dd id="sBody">-</dd></div>
        <div><dt>标签</dt><dd id="sTags">-</dd></div>
      </dl>
      <div class="actions">
        <button id="btnPick" class="primary">选择发布包目录</button>
        <button id="btnReload" class="ghost hidden">重新读取</button>
        <button id="btnClear" class="ghost hidden">清除</button>
      </div>
      <p id="notice" class="notice"></p>
    </section>

    <section class="card">
      <div class="row">
        <span class="label">填充</span>
        <span id="tabState" class="value">-</span>
      </div>
      <div class="actions">
        <button id="btnFill" class="primary" disabled>填充到小红书标签页</button>
      </div>
      <ol id="steps" class="steps"></ol>
    </section>

    <p class="foot">
      只填标题、正文和已生成的图片，不会替你点发布；素材从本机读取，不上传到任何服务器。
      从 MarkCard Studio 点「一键生成并打开创作平台」时，扩展会自动读取应用给出的发布包，不必在这里选目录。
      平台改版会让选择器失效，若某项没填上会在这里列出原因。
    </p>

    <script src="popup.js" type="module"></script>
  </body>
</html>
